services:
  opengym-go:
    image: gas85/opengym-go:latest
    container_name: opengym-go
    volumes:
      - ./data:/data         # users, passkeys, per-user state, session secret — BACK THIS UP
      - ./data/media/img:/usr/share/nginx/html/img
      - ./data/media/gif:/usr/share/nginx/html/gif
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: always

